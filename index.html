<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --surface:#F7F8F4;--panel:#ECEEE8;--ink:#14302A;--ink2:#52625B;--line:#CBD0C8;
  --accent:#1F4B41;--accent-ink:#F7F8F4;--ruj:#A61E3A;
  --map-out:#1E3A33;--map-in:#E9EBE4;--map-border:#F7F8F4;--map-line:#A9B0A7;--map-road:#8C948D;
  --name:#3A4A44;--halo:#E9EBE4;--name-out:rgba(238,243,238,.62);
  --disp:"Bricolage Grotesque","Trebuchet MS",Verdana,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#161F1C;--panel:#1F2A26;--ink:#E7EDE7;--ink2:#A2B0A9;--line:#35433E;
  --accent:#8CC7B5;--accent-ink:#10201B;--ruj:#F0708A;
  --map-out:#0D1412;--map-in:#26322E;--map-border:#4A5A54;--map-line:#42514B;--map-road:#6B7A74;
  --name:#C4D0CA;--halo:#26322E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#161F1C;--panel:#1F2A26;--ink:#E7EDE7;--ink2:#A2B0A9;--line:#35433E;
  --accent:#8CC7B5;--accent-ink:#10201B;--ruj:#F0708A;
  --map-out:#0D1412;--map-in:#26322E;--map-border:#4A5A54;--map-line:#42514B;--map-road:#6B7A74;
  --name:#C4D0CA;--halo:#26322E;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--surface);color:var(--ink);font:400 14px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ruj);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.12}
a{color:var(--accent)}

/* glava */
.top{display:flex;align-items:flex-end;gap:28px;padding:14px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:clamp(22px,2.5vw,32px);letter-spacing:-.015em}
.top .sub{color:var(--ink2);margin-top:3px}
.kpis{display:flex;gap:26px;margin-left:auto;align-items:flex-end;flex-wrap:wrap}
.kpi span{display:block;color:var(--ink2);font-size:12.5px}
.kpi b{font:700 clamp(19px,1.9vw,25px)/1.1 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:9px 13px;font-weight:600;white-space:nowrap}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink2)}
.mobile-only{display:none}

/* postavitev */
.work{flex:1;min-height:0;display:grid;grid-template-columns:318px minmax(0,1fr);position:relative}
.side{overflow-y:auto;padding:16px 18px 24px;border-right:1px solid var(--line);background:var(--surface);z-index:5}
.side h2{font-size:15px;margin:20px 0 8px}
.side h2:first-of-type{margin-top:0}
.period{display:flex;align-items:center;gap:8px}
.period select{flex:1;min-width:0;padding:7px 6px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.note{color:var(--ink2);font-size:12.5px;margin:7px 0 0}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.chk input{margin:0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.chk .ct{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums}
.cat{padding:5px 0 7px;cursor:pointer;display:block}
.cat .row{display:flex;align-items:baseline;gap:8px}
.cat input{margin:0;width:15px;height:15px;accent-color:var(--accent);flex:none;align-self:center}
.cat .nm{min-width:0}
.cat .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.cat .bar{height:5px;margin:4px 0 0 23px;background:var(--panel);border-radius:1px;overflow:hidden}
.cat .bar i{display:block;height:100%}
.cat.off{opacity:.5}
.reset{margin-top:18px;width:100%}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}

/* zemljevid */
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;z-index:0;background:var(--map-out);font-family:var(--body)}
.leaflet-container{background:var(--map-out);font:inherit}
.leaflet-tile-pane{filter:grayscale(1) contrast(.92)}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover,.leaflet-bar a:focus{background:var(--panel);color:var(--ink)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important;border-radius:3px}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--ink2);font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink2)}
.tools{position:absolute;right:12px;top:12px;z-index:800;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 11px}
.tools .chk{font-size:13px;padding:2px 0}
.chips{position:absolute;left:12px;bottom:14px;z-index:800;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 24px)}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-size:12.5px;color:var(--ink2)}
.shared{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:7px 11px;text-align:left}
.shared:hover{border-color:var(--ink2)}
.shared b{font-weight:600}
.empty-map{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:800;background:var(--surface);border:1px solid var(--line);padding:14px 18px;border-radius:3px;text-align:center;max-width:300px}

.dn{position:relative;background:none;border:0}
.dn svg{display:block;overflow:visible}
.dn .t{position:absolute;left:0;right:0;text-align:center;color:var(--ink);line-height:1.05;pointer-events:none}
.dn .t b{display:block;font:700 11.5px/1.05 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap}
.dn.sm .t b{font-size:10px}
.dn.sm .lb{font-size:10px;padding:0 4px}
.dn .t small{display:block;font-size:9.5px;color:var(--ink2);margin-top:1px}
.dn .lb{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--ink);padding:1px 6px;font-size:11.5px;font-weight:500;border-radius:2px;pointer-events:none;box-shadow:0 0 0 1px var(--line)}
.dn.on svg .bg{stroke:var(--ruj);stroke-width:3}
.pl{white-space:nowrap;font-size:11.5px;color:var(--name);text-shadow:0 0 2px var(--halo),0 0 2px var(--halo),0 0 3px var(--halo);pointer-events:none;transform:translateX(-50%)}
.pl.out{color:var(--name-out);text-shadow:none;font-size:11px;font-style:italic}
.leaflet-tooltip.tip{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:3px;font-size:12.5px;padding:3px 7px}
.leaflet-tooltip.tip::before{display:none}

/* predal */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(432px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:900;overflow-y:auto;transform:translateX(102%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.drawer.open{transform:none;visibility:visible}
.d-head{position:sticky;top:0;background:var(--surface);padding:14px 18px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);z-index:2}
.d-head h2{font-size:21px;flex:1;min-width:0;letter-spacing:-.01em;outline:none}
.d-head .kicker{color:var(--ink2);font-size:12.5px;margin-bottom:2px;font-family:var(--body);font-weight:400;letter-spacing:0}
.x{flex:none;width:32px;height:32px;border:0;background:none;font-size:20px;line-height:1;border-radius:3px;color:var(--ink)}
.x:hover{background:var(--panel)}
.d-body{padding:14px 18px 28px}
.back{display:inline-block;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 16px}
.stats div span{display:block;color:var(--ink2);font-size:12.5px}
.stats div b{font:700 18px/1.2 var(--disp);font-variant-numeric:tabular-nums}
.big{font:700 28px/1.1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.fund{display:flex;height:10px;border-radius:1px;overflow:hidden;background:var(--panel);margin:8px 0}
.fund i{display:block;height:100%}
.flist{list-style:none;margin:0;padding:0}
.flist li{display:flex;gap:8px;align-items:center;padding:2px 0}
.flist li em{width:10px;height:10px;flex:none;border-radius:1px}
.flist li span{margin-left:auto;font-variant-numeric:tabular-nums}
.sec{font-size:15px;margin:20px 0 8px}
.pr{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.pr:hover .pt{text-decoration:underline}
.pr .pt{font-weight:600;display:flex;gap:8px;align-items:flex-start}
.pr .pt em{width:10px;height:10px;border-radius:1px;flex:none;margin-top:5px}
.pr .pm{display:flex;justify-content:space-between;gap:10px;margin:3px 0 0 18px;color:var(--ink2);font-size:13px}
.pr .pm b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12.5px;padding:1px 7px;border:1px solid var(--line);border-radius:2px;margin-right:5px}
.flag{margin-top:14px;padding:9px 11px;border-left:3px solid var(--ruj);background:var(--panel);font-size:13px}
.flag b{display:block;margin-bottom:2px}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0}
dl.meta dt{color:var(--ink2)}dl.meta dd{margin:0}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);margin-bottom:8px}
.sortrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--ink2);font-size:13px}
.sortrow select{padding:4px 6px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.nas{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}
.about p{margin:0 0 10px}.about ul{margin:0 0 12px;padding-left:18px}.about li{margin-bottom:5px}
.scrim{display:none}

@media (max-width:860px){
  body{overflow:hidden}
  .top{padding:10px 14px;gap:8px 16px;align-items:center}
  .top .sub{display:none}
  .top h1{font-size:19px;flex:1 1 100%}
  .kpis{margin:0;gap:14px;flex:1 1 100%;align-items:center}
  .kpi span{font-size:11.5px}
  .kpi b{font-size:16px}
  .mobile-only{display:inline-block}
  .kpis .btn{margin-left:auto;padding:7px 10px}
  .kpi.opt{display:none}
  .work{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;inset:0;z-index:950;transform:translateX(-102%);visibility:hidden;transition:transform .2s ease,visibility .2s;border-right:0}
  .side.open{transform:none;visibility:visible}
  .side-close{display:flex!important}
  .tools{top:10px;right:10px;padding:4px 9px}
  .tools .chk{font-size:12px}
  .chips{left:8px;bottom:22px}
  .lvl{display:none}
  .drawer{width:100%;border-left:0}
}
.side-close{display:none;justify-content:space-between;align-items:center;margin-bottom:10px}
.side-close b{font:700 18px var(--disp)}
@media (prefers-reduced-motion:reduce){.drawer,.side{transition:none}}
</style>
</head>

const CATK=Object.keys(CAT);
const STAT=["V načrtovanju","V teku","Zaključen"];
const FUND={own:["Občina","#1F4B41"],eu:["EU","#2E86C1"],state:["Država","#C98A1B"],other:["Drugi viri","#8E4585"],rest:["Ni razčlenjeno","#A9B0A7"]};
const YMIN=D.leta[0], YMAX=D.leta[1];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=v=>v==null?"ni objavljena":Math.round(v).toLocaleString("sl-SI").replace(/\u00a0/g,".")+" €";
function short(v){ if(!v) return "–"; if(v>=999500) return (v/1e6).toLocaleString("sl-SI",{maximumFractionDigits:v>=1e7?0:1})+" M€"; return Math.max(1,Math.round(v/1000))+" k€"; }
const proj=n=>{n=n%100;return n===1?"projekt":n===2?"projekta":(n===3||n===4)?"projekti":"projektov"};
const NAS=Object.fromEntries(G.naselja.map(n=>[n.n,n]));
const VS=Object.fromEntries(G.vs.map(v=>[v.n,v]));
const byVS={}; G.naselja.forEach(n=>{(byVS[n.vs]=byVS[n.vs]||[]).push(n.n)});
const isShared=p=>(p.n.length>1&&!p.s)||p.n[0]==="Občina";

const init=()=>({from:YMIN,to:YMAX,cats:new Set(CATK),stat:new Set(STAT),fund:new Set(["own","eu","state","other"])});
let S=init();
function pYear(p,s){
  if(p.od==null&&p.do==null) return s.from===YMIN&&s.to===YMAX;
  const a=p.od!=null?p.od:p.do, b=p.do!=null?p.do:(p.status==="Zaključen"?p.od:YMAX);
  return a<=s.to&&b>=s.from;
}
function pFund(p,s){ if(s.fund.size===4) return true; return [...s.fund].some(k=>(p[k]||0)>0); }
const pass=(p,skip)=>(skip==="year"||pYear(p,S))&&(skip==="cat"||S.cats.has(p.cat))&&(skip==="stat"||S.stat.has(p.status))&&(skip==="fund"||pFund(p,S));
const cur=()=>P.filter(p=>pass(p));
const shareOf=(p,n)=>p.s?(p.s[n]||0):(p.n.length===1&&p.n[0]===n?1:0);
function aggFor(names,list){
  let v=0,count=0;const cats={};const own=[],shared=[];
  list.forEach(p=>{
    let sh=0; names.forEach(n=>sh+=shareOf(p,n));
    if(sh>0){const x=(p.v||0)*sh; v+=x; count++; cats[p.cat]=(cats[p.cat]||0)+x; own.push(p);}
    else if(isShared(p)&&p.n.some(n=>names.includes(n))) shared.push(p);
  });
  return {v,count,cats,own,shared};
}

/* --- zemljevid --- */
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const bounds=L.geoJSON(G.obcina).getBounds();
const map=L.map('map',{zoomSnap:.25,zoomDelta:.5,attributionControl:true,maxBounds:bounds.pad(.55),maxBoundsViscosity:.8,minZoom:9,maxZoom:17});
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('Meje: GURS RPE | Ceste: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
map.fitBounds(bounds,{padding:[20,20]});
const baseZoom=map.getZoom();
map.setMinZoom(Math.max(9,baseZoom-.75));
["polys","roads","places"].forEach((n,i)=>{const pn=map.createPane(n);pn.style.zIndex=350+i*10;if(n!=="polys")pn.style.pointerEvents="none";});
let tilesOn=false;
const ring=g=>g.type==="Polygon"?[g.coordinates]:g.coordinates;
const world=[[85,-180],[85,180],[-85,180],[-85,-180]];
const holes=ring(G.obcina).map(p=>p[0].map(c=>[c[1],c[0]]));
const mask=L.polygon([world,...holes],{pane:"polys",stroke:false,interactive:false,fillOpacity:1});
const outline=L.geoJSON(G.obcina,{pane:"polys",interactive:false,fill:false});
let lvlMode="vs", active=null;
function polyLayer(arr){
  return L.geoJSON({type:"FeatureCollection",features:arr.map(a=>({type:"Feature",properties:{n:a.n},geometry:a.g}))},{pane:"polys",
    onEachFeature:(f,l)=>{
      l.bindTooltip(f.properties.n,{sticky:true,className:"tip",direction:"top"});
      l.on("click",()=>openPlace(lvlMode,f.properties.n));
      l.on("mouseover",()=>{ if(!isActive(lvlMode,f.properties.n)) l.setStyle({weight:1.6,color:css("--ink2")}); });
      l.on("mouseout",()=>restyle());
    }});
}
const lyrN=polyLayer(G.naselja), lyrV=polyLayer(G.vs);
const rr=L.canvas({pane:"roads",padding:.2});
const roads=L.layerGroup();
const mkRoad=(arr,w,dash)=>L.polyline(arr.map(l=>l.map(c=>[c[1],c[0]])),{renderer:rr,weight:w,interactive:false,dashArray:dash||null,opacity:.9});
const rLines=[mkRoad(G.ceste.c,.7),mkRoad(G.ceste.b,1.25),mkRoad(G.ceste.a,2),mkRoad(G.ceste.r,1,"2 4")];
rLines.forEach(l=>roads.addLayer(l));
const isActive=(lv,n)=>active&&active.lv===lv&&active.n===n;
function restyle(){
  const inFill=css("--map-in"), line=css("--map-line"), bd=css("--map-border"), ruj=css("--ruj");
  mask.setStyle({fillColor:css("--map-out"),fillOpacity:tilesOn?.78:1});
  outline.setStyle({color:bd,weight:2.2,opacity:1});
  const showB=$("tBorders").checked;
  const st=lv=>(f)=>{
    const a=isActive(lv,f.properties.n);
    return {fillColor:inFill,fillOpacity:tilesOn?.42:1,color:a?ruj:line,weight:a?2.4:(showB?(lv==="vs"?1.1:.8):0),opacity:a||showB?1:0,dashArray:null};
  };
  lyrN.setStyle(st("n")); lyrV.setStyle(st("vs"));
  rLines.forEach(l=>l.setStyle({color:css("--map-road")}));
}
mask.addTo(map); 
/* podlaga OSM se vklopi samo, če jo okolje dovoli (npr. na lastni domeni) */
(function(){const t=new Image();t.onload=()=>{tilesOn=true;L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);restyle();};t.src="https://tile.openstreetmap.org/12/2198/1457.png";})();
outline.addTo(map);
roads.addTo(map);

const places=L.layerGroup().addTo(map);
function drawPlaces(markerNames){
  places.clearLayers();
  if(!$("tNames").checked) return;
  const z=map.getZoom();
  D.okolica.forEach(o=>{
    if(z<baseZoom-.25&&o[3]) return;
    places.addLayer(L.marker([o[1],o[2]],{pane:"places",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="pl out">${esc(o[0])}</div>`,iconSize:[0,0]})}));
  });
  if(lvlMode==="n"||z>=baseZoom+.25){
    G.naselja.forEach(n=>{
      if(markerNames.has(n.n)) return;
      places.addLayer(L.marker([n.lat,n.lon],{pane:"places",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="pl">${esc(n.n)}</div>`,iconSize:[0,0]})}));
    });
  }
}

const marks=L.layerGroup().addTo(map), leaders=L.layerGroup().addTo(map);
function donut(d,a){
  const sw=Math.max(6,d*.13), r=d/2-sw/2-1, C=2*Math.PI*r;
  let off=0,arcs="";
  const tot=Object.values(a.cats).reduce((x,y)=>x+y,0)||1;
  CATK.forEach(k=>{const v=a.cats[k];if(!v)return;const f=v/tot*C;
    arcs+=`<circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="${CAT[k][1]}" stroke-width="${sw}" stroke-dasharray="${f} ${C-f}" stroke-dashoffset="${-off}" transform="rotate(-90 ${d/2} ${d/2})"/>`;off+=f;});
  if(!a.v) arcs=`<circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="#A9B0A7" stroke-width="${sw}"/>`;
  return `<svg width="${d}" height="${d}" aria-hidden="true"><circle class="bg" cx="${d/2}" cy="${d/2}" r="${d/2-.5}" fill="var(--surface)" stroke="var(--surface)" stroke-width="1.5"/>${arcs}</svg>`;
}
function draw(){
  marks.clearLayers(); leaders.clearLayers();
  const list=cur();
  lvlMode=map.getZoom()>=baseZoom+1?"n":"vs";
  const ents=(lvlMode==="vs"?G.vs.map(v=>({n:v.n,lat:v.lat,lon:v.lon,a:aggFor(byVS[v.n]||[],list),label:v.n})):G.naselja.map(n=>({n:n.n,lat:n.lat,lon:n.lon,a:aggFor([n.n],list),label:n.n}))).filter(e=>e.a.count>0);
  const vmax=Math.max(1,...ents.map(e=>e.a.v));
  const small=map.getSize().x<560;
  ents.forEach(e=>{const base=small?38:50,span=small?20:38;e.d=Math.round(base+span*Math.sqrt(e.a.v/vmax));
    const p=map.latLngToContainerPoint([e.lat,e.lon]);e.x0=e.x=p.x;e.y0=e.y=p.y;});
  /* razmik med krogi */
  for(let it=0;it<60;it++){
    let moved=false;
    for(let i=0;i<ents.length;i++)for(let j=i+1;j<ents.length;j++){
      const a=ents[i],b=ents[j],min=(a.d+b.d)/2+(small?20:18);let dx=b.x-a.x,dy=(b.y-a.y);
      let dist=Math.hypot(dx,dy)||.01;
      if(dist<min){const push=(min-dist)/2;dx/=dist;dy/=dist;a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push;moved=true;}
    }
    if(!moved)break;
  }
  ents.forEach(e=>{
    const ll=map.containerPointToLatLng([e.x,e.y]);
    if(Math.hypot(e.x-e.x0,e.y-e.y0)>e.d/2){leaders.addLayer(L.polyline([[e.lat,e.lon],ll],{pane:"markerPane",color:css("--ink2"),weight:1,opacity:.7,interactive:false}));}
    const lv=lvlMode, on=isActive(lv,e.n);
    const txtTop=e.d/2-(e.d>=56?12:7);
    const lbl=small?e.label.replace(" pri Komnu",""):e.label;
    const html=`<div class="dn${on?" on":""}${small?" sm":""}" style="width:${e.d}px;height:${e.d}px">${donut(e.d,e.a)}<div class="t" style="top:${txtTop}px"><b>${short(e.a.v)}</b>${e.d>=56?`<small>${e.a.count} proj.</small>`:""}</div><div class="lb" style="top:${e.d+2}px">${esc(lbl)}</div></div>`;
    const m=L.marker(ll,{title:`${e.label}: ${eur(e.a.v)}, ${e.a.count} ${proj(e.a.count)}`,alt:`${e.label}: ${eur(e.a.v)}`,icon:L.divIcon({className:"",html,iconSize:[e.d,e.d],iconAnchor:[e.d/2,e.d/2]}),riseOnHover:true});
    m.on("click",()=>openPlace(lv,e.n));
    marks.addLayer(m);
  });
  const nm=new Set(lvlMode==="n"?ents.map(e=>e.n):[]);
  drawPlaces(nm);
  $("emptyMap").hidden=list.length>0;
  /* sloji meja glede na raven */
  if(lvlMode==="vs"){ if(map.hasLayer(lyrN)) map.removeLayer(lyrN); if(!map.hasLayer(lyrV)) lyrV.addTo(map);}
  else { if(map.hasLayer(lyrV)) map.removeLayer(lyrV); if(!map.hasLayer(lyrN)) lyrN.addTo(map);}
  outline.bringToFront(); restyle();
  $("lvl").textContent=lvlMode==="vs"?"Prikaz po vaških skupnostih. Približajte za posamezna naselja.":"Prikaz po naseljih. Oddaljite za vaške skupnosti.";
  const sh=list.filter(isShared), shv=sh.reduce((x,p)=>x+(p.v||0),0);
  const sb=$("sharedBtn"); sb.hidden=!sh.length;
  sb.innerHTML=`<b>Na več krajih: ${short(shv)}</b>, ${sh.length} ${proj(sh.length)}`;
}

/* --- filtri --- */
function fillYears(){
  for(const sel of [$("yFrom"),$("yTo")]){
    for(let y=YMIN;y<=YMAX;y++){const o=document.createElement("option");o.value=y;o.textContent=y;sel.appendChild(o);}
  }
}
function drawFilters(){
  $("yFrom").value=S.from;$("yTo").value=S.to;
  const noDate=P.filter(p=>p.od==null&&p.do==null).length;
  const narrowed=S.from!==YMIN||S.to!==YMAX;
  $("yNote").hidden=!narrowed;
  $("yNote").textContent=`${noDate} projektov brez objavljenega datuma je prikazanih samo pri celotnem obdobju.`;
  $("fStatus").innerHTML=STAT.map(s=>{const c=P.filter(p=>p.status===s&&pass(p,"stat")).length;
    return `<label class="chk"><input type="checkbox" data-stat="${esc(s)}" ${S.stat.has(s)?"checked":""}> ${esc(s)}<span class="ct">${c}</span></label>`}).join("");
  const byCat={};CATK.forEach(k=>byCat[k]={v:0,c:0});
  P.filter(p=>pass(p,"cat")).forEach(p=>{byCat[p.cat].v+=p.v||0;byCat[p.cat].c++;});
  const mx=Math.max(1,...CATK.map(k=>byCat[k].v));
  const order=CATK.slice().sort((a,b)=>byCat[b].v-byCat[a].v);
  $("fCats").innerHTML=order.map(k=>{const c=byCat[k];
    return `<label class="cat${S.cats.has(k)?"":" off"}"><span class="row"><input type="checkbox" data-cat="${k}" ${S.cats.has(k)?"checked":""}><span class="nm">${esc(CAT[k][0])}</span><span class="amt">${short(c.v)}</span></span><span class="bar" style="display:block"><i style="width:${Math.max(c.v?1.5:0,c.v/mx*100)}%;background:${CAT[k][1]}"></i></span></label>`}).join("");
  $("fFund").innerHTML=["own","eu","state","other"].map(k=>`<label class="chk"><input type="checkbox" data-fund="${k}" ${S.fund.has(k)?"checked":""}> ${FUND[k][0]}</label>`).join("");
  const dirty=narrowed||S.cats.size!==CATK.length||S.stat.size!==STAT.length||S.fund.size!==4;
  $("reset").hidden=!dirty;
}
function drawKPI(){
  const l=cur();
  const t=l.reduce((x,p)=>x+(p.v||0),0), own=l.reduce((x,p)=>x+(p.own||0),0);
  const ext=l.reduce((x,p)=>x+(p.eu||0)+(p.state||0)+(p.other||0),0);
  $("kTotal").textContent=eur(t);$("kOwn").textContent=eur(own);$("kExt").textContent=eur(ext);$("kCount").textContent=l.length;
}
function refresh(){drawFilters();drawKPI();draw();if(view&&view.t!=="project"&&view.t!=="about")render();}
$("side").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="yFrom"){S.from=+t.value;if(S.to<S.from)S.to=S.from;}
  else if(t.id==="yTo"){S.to=+t.value;if(S.from>S.to)S.from=S.to;}
  else if(t.dataset.stat){t.checked?S.stat.add(t.dataset.stat):S.stat.delete(t.dataset.stat);}
  else if(t.dataset.cat){t.checked?S.cats.add(t.dataset.cat):S.cats.delete(t.dataset.cat);}
  else if(t.dataset.fund){t.checked?S.fund.add(t.dataset.fund):S.fund.delete(t.dataset.fund);}
  refresh();
});
function resetAll(){S=init();refresh();}
$("reset").onclick=resetAll;$("reset2").onclick=resetAll;
["tBorders","tNames"].forEach(id=>$(id).onchange=draw);
$("tRoads").onchange=()=>{$("tRoads").checked?roads.addTo(map):map.removeLayer(roads);};
map.on("zoomend",draw);

/* --- predal --- */
let view=null, stack=[];
const dr=$("drawer");
function closeDrawer(){view=null;stack=[];active=null;dr.classList.remove("open");if(location.hash)history.replaceState(null,"",location.pathname+location.search);draw();}
function go(v,push){ if(push&&view)stack.push(view);view=v;render();dr.classList.add("open");dr.scrollTop=0;const h=dr.querySelector("h2");if(h)h.focus({preventScroll:true});
  if(v.t==="project")history.replaceState(null,"","#p"+v.id);else if(location.hash)history.replaceState(null,"",location.pathname+location.search);}
function openPlace(lv,n){active={lv,n};stack=[];go({t:"place",lv,n});draw();
  const e=(lv==="vs"?VS:NAS)[n], W=map.getSize().x, dw=dr.offsetWidth;
  if(e&&dw<W){const x=map.latLngToContainerPoint([e.lat,e.lon]).x; if(x>W-dw-70) map.panBy([x-(W-dw)/2,0],{duration:.25});}
}
function head(k,title){return `<div class="d-head"><div style="flex:1;min-width:0"><div class="kicker">${esc(k)}</div><h2 tabindex="-1">${esc(title)}</h2></div><button class="x" data-act="close" type="button" aria-label="Zapri">×</button></div>`;}
const backBtn=()=>stack.length?`<button class="linkish back" data-act="back" type="button">Nazaj</button>`:"";
function prRow(p,sh){
  const val=p.v==null?"vrednost ni objavljena":eur(p.v*(sh==null?1:sh));
  return `<button class="pr" data-p="${p.id}" type="button"><span class="pt"><em style="background:${CAT[p.cat][1]}"></em><span>${esc(p.t)}</span></span><span class="pm"><b>${val}</b><span>${esc(p.status)}${sh!=null&&sh<1?`, ${Math.round(sh*100)} % projekta`:""}</span></span></button>`;
}
function fundBlock(list){
  const sum={own:0,eu:0,state:0,other:0,rest:0};let tot=0;
  list.forEach(([p,sh])=>{["own","eu","state","other","rest"].forEach(k=>sum[k]+=(p[k]||0)*sh);tot+=(p.v||0)*sh;});
  const keys=Object.keys(sum).filter(k=>sum[k]>0);
  if(!tot||!keys.length) return "";
  const all=keys.reduce((x,k)=>x+sum[k],0);
  return `<h3 class="sec">Viri sredstev</h3><div class="fund" role="img" aria-label="Razdelitev virov sredstev">${keys.map(k=>`<i style="width:${sum[k]/all*100}%;background:${FUND[k][1]}"></i>`).join("")}</div><ul class="flist">${keys.map(k=>`<li><em style="background:${FUND[k][1]}"></em>${FUND[k][0]}<span>${eur(sum[k])}</span></li>`).join("")}</ul>`;
}
function render(){
  const v=view;if(!v)return;
  const list=cur();
  if(v.t==="place"){
    const names=v.lv==="vs"?(byVS[v.n]||[]):[v.n];
    const a=aggFor(names,list);
    const pop=names.reduce((x,n)=>x+(NAS[n]&&NAS[n].pop||0),0);
    const km=v.lv==="vs"?VS[v.n].km2:NAS[v.n].km2;
    const shareList=a.own.map(p=>[p,names.reduce((x,n)=>x+shareOf(p,n),0)]);
    let b=backBtn();
    b+=`<div class="big">${eur(a.v)}</div><div class="note" style="margin:2px 0 14px">${a.count} ${proj(a.count)} v izboru${a.shared.length?`, poleg tega ${a.shared.length} na več krajih`:""}</div>`;
    b+=`<div class="stats"><div><span>Prebivalci (2026)</span><b>${pop.toLocaleString("sl-SI")}</b></div><div><span>Površina</span><b>${km.toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})} km²</b></div><div><span>Gostota</span><b>${pop&&km?Math.round(pop/km):"–"} / km²</b></div><div><span>Investicije na prebivalca</span><b>${pop&&a.v?eur(a.v/pop):"–"}</b></div></div>`;
    if(v.lv==="vs"&&names.length>1) b+=`<p class="note" style="margin-bottom:10px">Naselja: ${names.map(n=>`<button class="nas" data-nas="${esc(n)}" type="button">${esc(n)}</button>`).join(", ")}</p>`;
    b+=fundBlock(shareList);
    b+=`<h3 class="sec">Projekti</h3>`;
    b+=a.own.length?a.own.slice().sort((x,y)=>(y.v||0)-(x.v||0)).map(p=>prRow(p,names.reduce((x,n)=>x+shareOf(p,n),0))).join(""):`<p class="note">V izbranem obdobju in področjih tu ni objavljenih projektov.</p>`;
    if(a.shared.length) b+=`<h3 class="sec">Projekti, ki segajo na več krajev</h3><p class="note" style="margin-bottom:6px">Niso šteti v znesek zgoraj, ker delež posameznega kraja ni objavljen.</p>`+a.shared.map(p=>prRow(p)).join("");
    dr.innerHTML=head(v.lv==="vs"?"Vaška skupnost":"Naselje",v.n)+`<div class="d-body">${b}</div>`;
  } else if(v.t==="project"){
    const p=P.find(x=>x.id===v.id); if(!p){closeDrawer();return;}
    let b=backBtn();
    b+=`<div class="big">${p.v==null?"Vrednost ni objavljena":eur(p.v)}</div>`;
    b+=`<div style="margin:8px 0 12px"><span class="tag">${esc(p.status)}</span><span class="tag">${esc(CAT[p.cat][0])}</span></div>`;
    b+=`<p style="margin:0 0 4px">${esc(p.o)}</p>`;
    b+=`<dl class="meta">`;
    b+=`<dt>Kraj</dt><dd>${p.n[0]==="Občina"?"Cela občina":p.n.map(n=>`<button class="nas" data-nas="${esc(n)}" type="button">${esc(n)}</button>`).join(", ")}</dd>`;
    if(p.start||p.end||p.od||p.do){const tx=p.start||p.end?`${esc(p.start||"")}${p.start&&p.end?" – ":""}${p.end?(p.start?"":"do ")+esc(p.end):""}`:`${p.od||""}${p.od&&p.do&&p.od!==p.do?"–":""}${p.do&&p.do!==p.od?p.do:""}`;b+=`<dt>Čas</dt><dd>${tx}</dd>`;}
    else b+=`<dt>Čas</dt><dd>Datum ni objavljen</dd>`;
    if(p.inv) b+=`<dt>Investitor</dt><dd>${esc(p.inv)}</dd>`;
    b+=`</dl>`;
    b+=fundBlock([[p,1]]);
    if(p.fl) b+=`<div class="flag"><b>Opomba k podatkom</b>${esc(p.fl)}</div>`;
    b+=`<p style="margin-top:16px"><a href="${esc(p.url)}" target="_blank" rel="noopener">Stran projekta na komen.si</a></p>`;
    dr.innerHTML=head("Projekt",p.t)+`<div class="d-body">${b}</div>`;
  } else if(v.t==="list"){
    const q=(v.q||"").trim().toLowerCase();
    const stems=q.split(/\s+/).filter(Boolean).map(w=>w.length>=5?w.slice(0,-2):w.length===4?w.slice(0,-1):w);
    let l=list.filter(p=>{const hay=(p.t+" "+p.o+" "+p.n.join(" ")+" "+CAT[p.cat][0]).toLowerCase();return stems.every(w=>hay.includes(w));});
    const so=v.sort||"v";
    l=l.slice().sort((a,b)=>so==="v"?(b.v||0)-(a.v||0):so==="y"?((b.do||b.od||0)-(a.do||a.od||0)):a.t.localeCompare(b.t,"sl"));
    const totalV=l.reduce((x,p)=>x+(p.v||0),0);
    dr.innerHTML=head(`${l.length} ${proj(l.length)}, ${eur(totalV)}`,"Vsi projekti")+`<div class="d-body"><input class="search" id="q" type="search" placeholder="Išči po imenu, kraju ali področju" aria-label="Išči projekte" value="${esc(v.q||"")}"><div class="sortrow"><label for="so">Razvrsti po</label><select id="so"><option value="v"${so==="v"?" selected":""}>vrednosti</option><option value="y"${so==="y"?" selected":""}>letu</option><option value="a"${so==="a"?" selected":""}>abecedi</option></select></div>${l.length?l.map(p=>prRow(p)).join(""):`<p class="note">Iskanju ne ustreza noben projekt. Spremenite besedilo ali ponastavite filtre.</p>`}</div>`;
    const qi=$("q");qi.oninput=()=>{view.q=qi.value;const pos=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(pos,pos);};
    $("so").onchange=e=>{view.sort=e.target.value;render();};
  } else if(v.t==="shared"){
    const l=list.filter(isShared).sort((a,b)=>(b.v||0)-(a.v||0));
    dr.innerHTML=head(`${l.length} ${proj(l.length)}, ${eur(l.reduce((x,p)=>x+(p.v||0),0))}`,"Projekti na več krajih")+`<div class="d-body"><p class="note" style="margin-bottom:10px">Ti projekti so šteti v skupno vrednost občine, ne pa v zneske posameznih krajev, ker delež po krajih ni objavljen.</p>${l.map(p=>prRow(p)).join("")}</div>`;
  } else if(v.t==="about"){
    const fl=P.filter(p=>p.fl);
    dr.innerHTML=head("Pojasnila","O podatkih")+`<div class="d-body about">
    <p>To je neuradni prikaz podatkov, ki jih je objavila Občina Komen. Zneski so bruto vrednosti, kot jih navaja občina, in vključujejo zaključene, tekoče ter načrtovane projekte.</p>
    <h3 class="sec">Viri</h3><ul>
    <li><a href="https://www.komen.si/za-obcane/projekti-in-investicije/" target="_blank" rel="noopener">Občina Komen, Projekti in investicije</a> (stanje ${esc(D.stanje)})</li>
    <li><a href="https://ipi.eprostor.gov.si/wfs-si-gurs-rpe/ogc/features/collections" target="_blank" rel="noopener">GURS, Register prostorskih enot</a>: meje občine, naselij in vaških skupnosti</li>
    <li><a href="https://pxweb.stat.si/SiStatData/pxweb/sl/Data/-/05C5006S.px" target="_blank" rel="noopener">SURS, tabela 05C5006S</a>: prebivalci po naseljih, 2026</li>
    <li>© OpenStreetMap: ceste in železnica</li></ul>
    <h3 class="sec">Kako so šteti zneski</h3><ul>
    <li>Pri skupnih projektih je prikazan delež za Komen, kjer ga občina objavlja.</li>
    <li>Projekti, ki segajo na več krajev brez objavljenega deleža, so prikazani ločeno in niso šteti v zneske posameznih krajev.</li>
    <li>Pri nekaterih projektih so investitorji država ali drugi; takšni zneski niso izdatki občinskega proračuna. Podatek o virih je prikazan pri vsakem projektu.</li>
    <li>Pri načrtovanih projektih so zneski ocene in se lahko spremenijo.</li></ul>
    <h3 class="sec">Vnosi, ki niso šteti</h3><ul>${D.izloceni.map(x=>`<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join("")}</ul>
    <h3 class="sec">Opombe pri ${fl.length} projektih</h3>${fl.map(p=>prRow(p)).join("")}</div>`;
  }
}
dr.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-p],[data-nas]");if(!t)return;
  if(t.dataset.act==="close")closeDrawer();
  else if(t.dataset.act==="back"){view=stack.pop();render();dr.scrollTop=0;}
  else if(t.dataset.p)go({t:"project",id:t.dataset.p},true);
  else if(t.dataset.nas){active={lv:"n",n:t.dataset.nas};go({t:"place",lv:"n",n:t.dataset.nas},true);const n=NAS[t.dataset.nas];if(n)map.flyTo([n.lat,n.lon],Math.max(map.getZoom(),baseZoom+1.25),{duration:.5});else draw();}
});
$("openList").onclick=()=>{active=null;stack=[];go({t:"list"});draw();};
$("sharedBtn").onclick=()=>{active=null;stack=[];go({t:"shared"});draw();};
$("openAbout").onclick=()=>{side.classList.remove("open");stack=[];go({t:"about"});};
const side=$("side");
$("openFilters").onclick=()=>side.classList.add("open");
$("closeFilters").onclick=()=>side.classList.remove("open");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(side.classList.contains("open"))side.classList.remove("open");else if(view)closeDrawer();}});
new ResizeObserver(()=>{map.invalidateSize();}).observe(document.querySelector(".mapwrap"));
const mq=matchMedia("(prefers-color-scheme:dark)");mq.addEventListener("change",()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

$("asOf").textContent=D.stanje;
fillYears();refresh();
const h=location.hash.match(/^#p(\d+)$/);if(h&&P.find(p=>p.id===h[1]))go({t:"project",id:h[1]});
})();
</script>
</body>
</html>
